<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job Tracker</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        width: 340px;
        padding: 16px;
      }
    </style>
  </head>
  <body class="stack">
    <div class="row">
      <h1>Job Tracker</h1>
      <a id="open-app" href="#" target="_blank">Open app</a>
    </div>

    <div id="setup" class="notice bad" hidden>
      Add your extension token in <a id="open-options" href="#">settings</a> to start saving.
    </div>

    <section class="stack">
      <h2>This page</h2>
      <div>
        <label for="company">Company</label>
        <input id="company" type="text" />
      </div>
      <div>
        <label for="role">Role</label>
        <input id="role" type="text" />
      </div>
      <div>
        <label for="link">Job link</label>
        <input id="link" type="url" />
      </div>
      <div class="row">
        <span id="hint" class="muted"></span>
        <button id="save" class="primary">Save application</button>
      </div>
      <div id="result" class="notice" hidden></div>
    </section>

    <section>
      <div class="row">
        <h2>Recent</h2>
        <button id="retry" hidden></button>
      </div>
      <ul id="recent" class="recent"></ul>
      <p id="no-recent" class="muted">Nothing saved yet.</p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
